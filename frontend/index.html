<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>MobileMap</title>
  </head>
  <body>
    <div id="app">
      <div id="login" class="login hidden">
        <form id="login-form" class="login-card">
          <h1>MobileMap</h1>
          <label>
            Логин
            <input id="login-user" name="username" autocomplete="username" required />
          </label>
          <label>
            Пароль
            <input
              id="login-pass"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <p id="login-error" class="error" hidden></p>
          <button type="submit">Войти</button>
        </form>
      </div>
      <div id="shell" class="shell hidden">
        <header class="toolbar">
          <div id="map-select-wrap" class="control compact hidden">
            <label for="map-select">Карта</label>
            <select id="map-select"></select>
          </div>
          <details id="layers-panel" class="control compact">
            <summary>Слои</summary>
            <div id="line-tiles-list" class="layers-list line-tiles-list hidden"></div>
            <div id="layers-list" class="layers-list"></div>
          </details>
          <div id="status" class="status" aria-live="polite"></div>
        </header>
        <div id="map" class="map"></div>
        <aside id="card" class="card hidden"></aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
